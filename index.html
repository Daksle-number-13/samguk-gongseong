<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="pixi.min.js"></script>
<title>삼국공성전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#172622"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></head>
<body>
<style>
/* Layout: one-screen portrait game — header strip, square battlefield, scrolling command panel with in-panel recruit picker */
:root{
  --ink:#0f1c1a; --lacquer:#152824; --panel:#1b302b; --line:#2d4a43;
  --paper:#efe6d2; --muted:#a3ad9f; --gold:#d9b25b; --cinnabar:#c4472f; --jade:#5fae86;
  --r0:#8f9a8c; --r1:#5f97d0; --r2:#a77bd6; --r3:#e0b54f;
  --display:'Song Myung','Nanum Myeongjo','Batang',serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;height:100dvh}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
header{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stage{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em}
.stage small{font-family:var(--body);font-size:.78rem;color:var(--muted);margin-right:6px;letter-spacing:.08em}
.gold{font-family:var(--display);font-size:1.3rem;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold b{font-weight:400;font-size:.95rem;border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-right:6px}
.bar{height:6px;background:var(--lacquer);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cinnabar),var(--gold));transition:width .2s}
.gate{font-family:var(--body);font-size:.72rem;color:var(--ink);background:var(--cinnabar);border-radius:3px;padding:1px 5px;vertical-align:3px}
.bonds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 4px}
.bl-h{font-family:var(--display);font-size:.9rem;color:var(--paper);margin-right:2px}
.bl-e{font-size:.75rem;color:var(--muted)}
.bond{font-size:.72rem;padding:5px 9px;cursor:pointer;border-radius:10px;border:1px dashed var(--line);color:var(--muted)}
.bond.on{border:1px solid var(--gold);color:var(--ink);background:var(--gold)}
.bond-d{margin:0;padding:1px 0;font-size:.74rem;color:var(--muted);line-height:1.4}
.bond-d b{font-weight:400;color:var(--gold)}
.bondhint{display:inline-block;font-size:.68rem;color:var(--ink);background:var(--gold);border-radius:8px;padding:0 6px;margin-bottom:3px}
.mile{color:#f0c070}
.spec b{font-weight:400;color:#f0c070}
.mr{display:inline-flex;align-items:center;gap:8px;flex:none;white-space:nowrap}
.specrow{align-items:center;margin-top:2px}
.specrow .spec{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsound{min-height:32px!important;font:inherit;font-size:.72rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;min-height:24px}
.hsound.off{text-decoration:line-through;opacity:.7}
.tabs button{position:relative}
.tabs button.hint::after{content:'';position:absolute;top:8px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--gold);animation:hintDot 1s ease-in-out infinite}
@keyframes hintDot{50%{transform:scale(1.5);opacity:.6}}
@keyframes hintPulse{0%,100%{box-shadow:inset 0 -3px 0 rgba(240,192,112,.2)}50%{box-shadow:inset 0 -3px 0 rgba(240,192,112,1)}}
.buy.hint{animation:hintPulse2 1.2s ease-in-out infinite}
@keyframes hintPulse2{0%,100%{box-shadow:0 0 0 0 rgba(240,192,112,.0)}50%{box-shadow:0 0 0 4px rgba(240,192,112,.55)}}
@media (prefers-reduced-motion: reduce){ .buy.hint{animation:none;outline:2px solid var(--gold)} .tabs button.hint::after{animation:none} }
.hspeed{min-height:32px!important;font:inherit;font-size:.78rem;font-weight:700;color:var(--gold);background:transparent;border:1px solid var(--gold);border-radius:4px;padding:2px 8px;cursor:pointer;min-height:24px;min-width:38px}
.hspeed.on{background:var(--gold);color:var(--ink)}
.hreset{min-height:32px!important;font:inherit;font-size:.72rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;min-height:24px}
.hreset.arm{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--paper)}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.field{width:min(100%,46vh,46dvh);aspect-ratio:1;max-width:100%;margin:0 auto;position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--lacquer)}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
/* 전장 위 DOM 오버레이: 안내 띠·미니맵 (글자 크기 1em = 전장 폭/400) */
.ov{position:absolute;inset:0;pointer-events:none;opacity:0;font-size:1px}
.ov .bn{position:absolute;left:0;right:0;box-sizing:border-box}
.ov .bn b{display:block;font:400 28em/1.2 "Song Myung",serif;color:#efe6d2}
.ov .bn p{margin:0;font:400 max(12em,12px)/1.5 "Gowun Dodum",sans-serif;color:#a3ad9f}
.ov .bn.intro{top:8em;padding:5em 10em 7em 11em;background:rgba(15,28,26,.86);border-left:3em solid #f0c070}
.ov .bn.intro b{font-size:max(14em,13px);margin-bottom:.25em}
.ov .bn.intro p{color:#c9cfc4}
.ov .bn.intro em{font-style:normal;color:#f0c070;margin-right:.5em}
.ov .bn.clear,.ov .bn.fail{top:150em;height:100em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4em;text-align:center}
.ov .bn.clear{background:rgba(15,28,26,.85);border-top:1.5em solid #d9b25b;border-bottom:1.5em solid #d9b25b}
.ov .bn.clear .rw{font-size:14em;color:#d9b25b}
.ov .bn.fail{background:rgba(40,12,10,.88);border-top:1.5em solid #c4472f;border-bottom:1.5em solid #c4472f}
.ov .bn.fail .rw{font-size:13em;color:#d9a08f}
.mm{position:absolute;right:2%;bottom:2%;width:24%;height:auto;aspect-ratio:1;opacity:.92;pointer-events:none;border:1px solid rgba(239,230,210,.35);box-sizing:border-box}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--gold);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:.85rem;line-height:1.4;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid rgba(239,230,210,.35);color:var(--paper);font-family:var(--display);font-size:.62rem;letter-spacing:-.04em;cursor:pointer;padding:0;opacity:.75}
.chip{background-image:linear-gradient(to top,rgba(111,211,138,.35) var(--hp,100%),transparent var(--hp,100%))}
.chip.dead{filter:grayscale(1);color:#e0634a;opacity:.6}
.chip.on{border-color:var(--gold);opacity:1;box-shadow:0 0 0 2px rgba(217,178,91,.35)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--lacquer);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-family:var(--display);font-size:1rem;padding:8px 0;min-height:40px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 12px 12px;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.seal{width:38px;height:38px;font-size:.72rem!important;letter-spacing:-.04em;line-height:1;text-align:center;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;color:var(--paper);box-sizing:border-box;border:2px solid var(--r0)}
.info{min-width:0}
.info h3{margin:0;font-family:var(--display);font-weight:400;font-size:1rem;line-height:1.3}
.info h3 span{font-family:var(--body);font-size:.75rem;color:var(--muted);margin-left:6px}
.info p{margin:2px 0 0;font-size:.8rem;color:var(--muted);line-height:1.4}
.info p em{font-style:normal;color:var(--paper);font-variant-numeric:tabular-nums}
.tag{white-space:nowrap;font-family:var(--body);font-size:.7rem;padding:1px 5px;border-radius:3px;border:1px solid currentColor;margin-left:6px;vertical-align:2px}
.lv{font-family:var(--display);font-size:1.05rem;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.buy{min-width:78px;min-height:44px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:var(--body);font-size:.85rem;line-height:1.2;cursor:pointer;padding:4px 8px;font-variant-numeric:tabular-nums}
.buy strong{display:block;font-family:var(--display);font-weight:400;font-size:1rem}
.buy:not(:disabled):active{background:var(--gold);color:var(--ink)}
.buy:disabled{border-color:var(--line);color:var(--muted);cursor:default}
.btns{display:flex;gap:6px;align-items:center}
.buy.max{min-width:52px;padding:4px 6px;border-style:dashed}
.buy.max[hidden]{display:none}
.buy.ready{background:var(--gold);color:var(--ink)}
.recruit{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0 12px;border-bottom:1px solid var(--gold)}
.recruit h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.15rem}
.recruit p{margin:2px 0 0;font-size:.78rem;color:var(--muted);line-height:1.45}
.odds{font-size:.72rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.odds b{font-weight:400}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.help{margin-top:8px;font-size:.78rem;color:var(--muted);line-height:1.5}
.help summary{cursor:pointer;padding:8px 0;color:var(--paper);font-family:var(--display);font-size:.95rem}
.help p{margin:0 0 8px}
.help b{font-weight:400;color:var(--paper)}
@media (max-height:700px){ .stage{font-size:1.15rem} .gold{font-size:1.15rem} .meta{font-size:.72rem} }
.note{font-size:.75rem;color:var(--muted);padding-top:10px;line-height:1.5}
.reset{align-self:flex-start;margin-top:8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:6px 10px;font-family:var(--body);font-size:.75rem;cursor:pointer}
.reset.arm{border-color:var(--cinnabar);color:var(--cinnabar)}
.pick{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;gap:12px;padding:14px;box-sizing:border-box;overflow-y:auto}
.pick[hidden]{display:none}
.swap{display:flex;flex-direction:column}
.swapbtn{background:none;border:0;border-bottom:1px solid var(--line);color:var(--paper);text-align:left;font-family:var(--body);cursor:pointer;width:100%}
.swapbtn:active{background:var(--panel)}
.item.empty .seal{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.item.empty h3{color:var(--muted)}
.buy.arm{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--paper)}
.pick h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem;text-align:center}
.pick > p{margin:0;font-size:.8rem;color:var(--muted);text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:8px;border:2px solid var(--r0);background:var(--panel);color:var(--paper);font-family:var(--body);cursor:pointer;text-align:center}
.card:active{transform:scale(.97)}
.chip.dead{font-size:.55rem;line-height:1.1}
.chip.art{background-size:cover;background-position:center}
.seal.art{background-size:cover;background-position:center;border-width:2px;color:transparent}
.cardart{width:100%;height:132px;display:flex;align-items:flex-end;justify-content:center;border-radius:6px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--fc) 45%,transparent),transparent 70%)}
.cardart img{max-width:100%;max-height:132px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.card .seal{width:56px;height:56px;font-size:.95rem!important}
.card .nm{font-family:var(--display);font-size:1.2rem}
.card .rt{font-size:.75rem}
.card .ds{font-size:.76rem;color:var(--muted);line-height:1.4}
.card .st{font-size:.78rem;color:var(--gold);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){ .card:active{transform:none} .bar i{transition:none} }

@media (max-height:760px){ .cardart{height:88px} .cardart img{max-height:88px} .card{padding:10px 6px 8px;gap:4px} .card .ds{font-size:.72rem} }
/* 가로 화면: 세로로 돌려 달라는 안내 (앱은 세로 고정 예정) */
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){ .rotate{display:flex;position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:1.2rem;padding:24px} }

.bulk{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.bulk span{font-size:.75rem;color:var(--muted);line-height:1.4}
.bulk .buy{flex:none;border-style:dashed}
.tier-h{padding:12px 0 4px;font-size:.8rem;color:var(--gold);border-bottom:1px solid var(--line)}
.tier-h b{font-family:var(--display);font-weight:400;font-size:.95rem}
.tier-h span{color:var(--muted);font-size:.72rem}
.tier-h.locked{color:var(--muted)}
.item.locked{opacity:.45}
.lvbar{display:block;height:3px;background:var(--line);border-radius:2px;margin:3px 0 2px;overflow:hidden;max-width:160px}
.lvbar b{display:block;height:100%;background:var(--gold);width:0}
.lvbar.full b{background:var(--paper)}
.tier-more{font-size:.72rem;color:var(--muted);padding:10px 0 0;text-align:center}
/* 창 올림: 탭을 누르면 패널이 전장을 덮으며 위로 올라옴 */
.app{position:relative}
.app.sheet .panel{position:absolute;left:8px;right:8px;top:var(--sheet-top,8px);bottom:8px;z-index:20;box-shadow:0 -10px 28px rgba(0,0,0,.55);animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(35%);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){ .app.sheet .panel{animation:none} }
.sheet-x{display:none;flex:0 0 44px!important;font-size:.9rem!important;color:var(--gold)!important}
.app.sheet .sheet-x{display:block}
.dps{color:var(--gold);font-variant-numeric:tabular-nums}
.udps{font-style:normal;font-size:.72rem;color:var(--gold);margin-left:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick .reroll{align-self:center;min-width:160px;border-style:dashed}
.cards.c3{grid-template-columns:repeat(3,1fr);gap:6px}
.cards.c3 .card{padding:10px 4px 8px;gap:4px}
.cards.c3 .card .ds{display:none}
.cards.c3 .card .st{font-size:.7rem}
.banbox{padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.banbox h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:.95rem}
.banbox h4 span{color:var(--muted);font-size:.8rem;margin-left:6px}
.banbox p{margin:0;font-size:.75rem;color:var(--muted)}
.banlist{display:flex;flex-wrap:wrap;gap:6px}
.banc{font-size:.75rem;padding:6px 9px;min-height:32px;border-radius:14px;border:1px solid var(--fc);background:transparent;color:var(--paper);cursor:pointer}
.banc.on{background:var(--cinnabar);border-color:var(--cinnabar);text-decoration:line-through}
/* 인연 필살기 */
.bond.on{background:linear-gradient(90deg,var(--gold) var(--g,0%),#7a6a3a var(--g,0%))}
.ult{position:absolute;left:0;right:0;top:34%;pointer-events:none;text-align:center;opacity:0;z-index:5}
.ult b{display:block;font:400 2.3rem/1.1 "Song Myung",serif;color:#fff;text-shadow:0 0 14px var(--uc),0 0 4px var(--uc),0 2px 0 #000}
.ult i{display:block;font-style:normal;font:400 1.05rem/1.4 "Song Myung",serif;color:var(--uc);text-shadow:0 1px 3px #000}
.ult small{display:inline-block;margin-top:4px;padding:2px 10px;font-size:.72rem;color:#efe6d2;background:rgba(10,20,18,.75);border-radius:10px}
.ult.go{animation:ultIn 2.2s ease-out forwards}
@keyframes ultIn{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){ .ult.go{animation:ultFade 2.2s linear forwards} @keyframes ultFade{0%,80%{opacity:1}100%{opacity:0}} }
.codex{margin:2px 0 6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.codex summary{cursor:pointer;font-size:.85rem;font-family:var(--display)}
.codex summary b{color:var(--gold);font-weight:400}
.codex summary span{font-family:var(--body);font-size:.72rem;color:var(--muted);margin-left:4px}
.cx-grid{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 4px}
.cx{font-size:.72rem;padding:4px 8px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);cursor:pointer}
.cx.on{border-style:solid;border-color:var(--gold);color:var(--gold)}
.cx-rew{margin:4px 0 2px;padding-left:18px;font-size:.74rem;color:var(--muted);line-height:1.6}
.cx-rew li.on{color:var(--paper)}
.cx-rew li.on b{color:var(--gold)}
.awk{color:#ffd860}
h3.awk{text-shadow:0 0 8px rgba(255,216,96,.45)}
.awkp{font-size:.72rem;color:var(--muted)}
.cx-awk{margin:4px 0;font-size:.74rem;color:var(--muted);line-height:1.5}
.cx-awk b{color:#ffd860;font-weight:400}
.grade{display:inline-block;font:400 .62rem/1 var(--body);color:var(--gc);border:1px solid var(--gc);border-radius:8px;padding:2px 5px;vertical-align:middle;text-shadow:none}
.rank .rk-me{display:flex;gap:6px;margin:8px 0 4px}
.rank input{flex:1;min-width:0;min-height:40px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font:inherit;user-select:text;-webkit-user-select:text}
.rk-note{font-size:.75rem;color:var(--muted);margin:4px 0}
.rk-note b{color:var(--gold);font-weight:400}
.rk-err{color:var(--cinnabar)}
.rk-list{list-style:none;margin:6px 0;padding:0}
.rk-list li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.82rem}
.rk-list li.me{background:rgba(217,178,91,.12)}
.rk-n{width:24px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-sub{font-size:.68rem;color:var(--muted)}
.rk-list b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.rk-ref{min-height:36px;margin-top:4px}
.rankbtn{position:absolute;left:6px;top:6px;z-index:4;font:400 .78rem/1 var(--body);color:var(--gold);background:rgba(15,28,26,.82);border:1px solid var(--gold);border-radius:14px;padding:7px 10px;min-height:32px;cursor:pointer}
.rankm,.nickm{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.rankm[hidden],.nickm[hidden]{display:none}
.rk-panel{width:min(440px,100%);max-height:86vh;max-height:86dvh;overflow:auto;background:var(--lacquer);border:1px solid var(--gold);border-radius:8px;padding:14px;box-sizing:border-box}
.rk-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-size:1.05rem}
.rk-head b{font-weight:400;color:var(--gold)}
.rk-x{background:none;border:0;color:var(--paper);font-size:1.1rem;min-width:40px;min-height:40px;cursor:pointer}
.nickm h2{margin:0 0 6px;font-family:var(--display);font-weight:400;color:var(--gold);text-align:center;font-size:1.5rem}
.nickm p{margin:0 0 12px;font-size:.85rem;color:var(--paper);text-align:center;line-height:1.6}
.nickm input,.rankm input{width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font:inherit;font-size:1rem;user-select:text;-webkit-user-select:text}
.nickm .buy{width:100%;margin-top:10px}
.nickm small{display:block;margin-top:8px;font-size:.72rem;color:var(--muted);text-align:center}
.chatbtn{left:auto;right:6px}
.ticker{position:absolute;left:8px;right:8px;top:46px;z-index:4;pointer-events:none;font-size:.78rem;line-height:1.4;color:var(--paper);background:rgba(15,28,26,.85);border-left:3px solid var(--line);padding:5px 8px;border-radius:4px;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--gold);font-weight:400;margin-right:4px}
.ticker.news{border-left-color:var(--gold);color:#f0c96a}
.ticker.go{animation:tick 6s ease forwards}
@keyframes tick{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.chat-panel{display:flex;flex-direction:column;height:80vh;height:80dvh;position:relative}
.chat-list{flex:1;min-height:0;overflow-y:auto;margin:8px 0;padding-right:2px}
.cm{display:flex;gap:6px;align-items:baseline;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.84rem;cursor:pointer;word-break:break-all}
.cm b{color:var(--gold);font-weight:400;flex:none}
.cm span{flex:1;min-width:0}
.cm em{font-style:normal;font-size:.65rem;color:var(--muted);flex:none}
.cm.me b{color:#9fe0a0}
.cm.news{color:#f0c96a;cursor:default;background:rgba(217,178,91,.07)}
.chat-in{display:flex;gap:6px}
.chat-in input{flex:1;min-width:0}
.chat-menu{position:absolute;left:14px;right:14px;bottom:70px;background:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.chat-menu[hidden]{display:none}
.chat-menu p{margin:0;font-size:.82rem;word-break:break-all}
.cloud .cl-code{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.cloud .cl-code span{font-size:.75rem;color:var(--muted)}
.cloud .cl-code b{font:400 1rem/1.2 ui-monospace,monospace;color:var(--gold);letter-spacing:.04em;user-select:text;-webkit-user-select:text}
.cloud .cl-load{display:flex;gap:6px;margin-top:10px}
.cloud input{flex:1;min-width:0;min-height:40px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font:inherit;font-size:.82rem;user-select:text;-webkit-user-select:text}
/* PC(넓은 화면): 채팅창 오른쪽 고정 */
@media (min-width: 980px){
  html.chatdock body{padding-right:360px;box-sizing:border-box}
  #chatm.dock{position:fixed;inset:0 0 0 auto;width:360px;background:transparent;padding:12px;z-index:20;display:flex;align-items:stretch}
  #chatm.dock .rk-panel{height:auto;max-height:none;width:100%}
  #chatm.dock .rk-x{display:none}
  html.chatdock #chatbtn{display:none}
}
.slotgift{font-style:normal;font-size:.7rem;color:#ffd860;border:1px solid #ffd860;border-radius:8px;padding:1px 6px;margin-left:4px}

/* 장수 카드: 돌파 막대 · 인연 칩 · 상세 수치 작게 */
.mbar{position:relative;height:15px;margin:4px 0 3px;background:rgba(0,0,0,.35);border:1px solid rgba(217,178,91,.35);border-radius:8px;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(217,178,91,.35),rgba(240,192,112,.75))}
.mbar span{position:relative;display:block;font-size:.68rem;line-height:13px;padding-left:6px;color:var(--paper)}
.mbar.near{border-color:#f0c070;box-shadow:0 0 6px rgba(240,192,112,.5)}
.hb{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px}
.bond.sm{font-size:.66rem;padding:1px 6px}
.item .info p.sub{font-size:.7rem;color:var(--muted);line-height:1.45}
/* 다음 목표 */
.goal{margin:2px 0 8px;padding:7px 10px;border:1px solid var(--gold);border-radius:10px;background:rgba(217,178,91,.08);font-size:.8rem;line-height:1.45}
.goal b{color:var(--gold);margin-right:6px}.goal em{font-style:normal;color:#9fe0a0}
.goal small{display:block;font-size:.68rem;color:var(--muted)}
/* 등용 카드: 인연 완성 */
.card.done{border-color:#f0c070!important;box-shadow:0 0 10px rgba(240,192,112,.55)}
.bonddone{font-size:.72rem;color:#f0c070;font-weight:700;margin-bottom:3px}
/* 도감 버튼 (랭킹 버튼 아래) */
.cxbtn{top:44px}
</style>

function fmt(n){
  n=Math.floor(n);

  const U=[['극',1e48],['재',1e44],['정',1e40],['간',1e36],['구',1e32],['양',1e28],['자',1e24],['해',1e20],['경',1e16],['조',1e12],['억',1e8],['만',1e4]];
  for(const [u,v] of U){ if(n>=v){ const x=n/v; return (x<10?x.toFixed(2).replace(/\.?0+$/,''):x<100?x.toFixed(1).replace(/\.0$/,''):Math.floor(x).toString())+u; } }
}

}

    for(const [di,dj] of dirs){ for(let s=1;s<=3;s++){ const i=t.i+di*s, j=t.j+dj*s; if(i<0||j<0||i>=N||j>=N) break; const c=grid[j*N+i]; if(c&&c.alive) hit(c,dmg); }
      fx.push({type:'slash',x0:t.x,y0:t.y,x1:t.x+di*CS*3,y1:t.y+dj*CS*3,t:0.22,T:0.22,col:h.mech==='cross'?'#e8d088':'#e0a0e8'}); } break; }
  case 'boomerang': {
    const reach=L+CS*5, ex=u.x+ux*reach, ey=u.y+uy*reach;
    nearSeg(u.x,u.y,ex,ey,CS*0.7,c=>hit(c,dmg)); nearSeg(ex,ey,u.x,u.y,CS*0.7,c=>hit(c,dmg*0.7));
    fx.push({type:'arc2',x0:u.x,y0:u.y,x1:ex,y1:ey,t:0.45,T:0.45}); break; }
  case 'mark': {
    let best=null; near(t.x,t.y,CS*6,c=>{ if(!best||c.max>best.max) best=c; });
    if(best){ markCell=best; hit(best,dmg); fx.push({type:'ring',x:best.x,y:best.y,R:CS*1.2,t:0.6,T:0.6,col:'#ff6050'}); } break; }
  case 'execute': {
    let best=t,br=t.hp/t.max; near(t.x,t.y,CS*3,c=>{ const r=c.hp/c.max; if(r<br){br=r;best=c;} });
    let cur=best, r=br;
    for(let k=0;k<5&&cur;k++){ hit(cur,dmg*(r<0.35?4:1)); fx.push({type:'slash',x0:cur.x-8,y0:cur.y-8,x1:cur.x+8,y1:cur.y+8,t:0.25,T:0.25,col:r<0.35?'#ff5050':'#e0e0e0'});
      if(cur.alive) break; let nb=null,nr=2; near(cur.x,cur.y,CS*3,c=>{ const q=c.hp/c.max; if(q<nr){nr=q;nb=c;} }); cur=nb; r=nr; }
    break; }
  case 'ring': {
    const r0=CS*2.5, r1=CS*4; FIRE=true;
    near(t.x,t.y,r1,c=>{ const d=Math.hypot(c.x-t.x,c.y-t.y); if(d>=r0) hit(c,dmg); }); FIRE=false;
    fx.push({type:'ring',x:t.x,y:t.y,R:r1,t:0.4,T:0.4,col:'#f0904a'}); fx.push({type:'ring',x:t.x,y:t.y,R:r0,t:0.4,T:0.4,col:'#f0904a'}); break; }
  case 'assassin': {
    const top=[]; for(const c of cells){ if(!c.alive) continue; if(top.length<3){ top.push(c); top.sort((a,b)=>b.hp-a.hp); } else if(c.hp>top[2].hp){ top[2]=c; top.sort((a,b)=>b.hp-a.hp); } }
    top.slice(1).forEach(c=>{ hit(c,dmg*0.7); near(c.x,c.y,CS*1.2,q=>{ if(q!==c) hit(q,dmg*0.3); }); fx.push({type:'ring',x:c.x,y:c.y,R:CS,t:0.3,T:0.3,col:'#d0d8ff'}); });
    const best=top[0];
    if(best){ hit(best,dmg); near(best.x,best.y,CS*1.2,q=>{ if(q!==best) hit(q,dmg*0.3); }); fx.push({type:'slash',x0:u.x,y0:u.y,x1:best.x,y1:best.y,t:0.2,T:0.2,col:'#d0d8ff'}); fx.push({type:'ring',x:best.x,y:best.y,R:CS,t:0.3,T:0.3,col:'#d0d8ff'}); } break; }
  case 'gatling':
    { const pool=[t]; near(t.x,t.y,CS*2.5,c=>{ if(c!==t&&pool.length<6) pool.push(c); }); for(let k=0;k<BF.gatling;k++) shots.push({x:u.x-ux*k*10,y:u.y-uy*k*10,t:pool[k%pool.length],sp:600,dmg,col:'#f6e0b0',w:1.1}); }
    break;
  case 'quake': {
    const pool=[]; near(t.x,t.y,CS*6,c=>pool.push(c));
    for(let k=0;k<14&&pool.length;k++){ const c=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; hit(c,dmg); fx.push({type:'ring',x:c.x,y:c.y,R:CS*0.7,t:0.3,T:0.3,col:'#b08a60'}); } break; }
  case 'split': {
    hit(t,dmg);
    for(const da of [-0.35,0,0.35]){ const a=Math.atan2(uy,ux)+da, ex=t.x+Math.cos(a)*CS*5, ey=t.y+Math.sin(a)*CS*5;
      nearSeg(t.x+Math.cos(a)*CS*0.6,t.y+Math.sin(a)*CS*0.6,ex,ey,CS*0.45,c=>hit(c,dmg*0.7)); fx.push({type:'slash',x0:t.x,y0:t.y,x1:ex,y1:ey,t:0.2,T:0.2,col:'#f0e0b0'}); }
    fx.push({type:'slash',x0:u.x,y0:u.y,x1:t.x,y1:t.y,t:0.15,T:0.15,col:'#f0e0b0'}); break; }
  case 'smoke': {
    const R=CS*3.2; near(t.x,t.y,R,c=>{ hit(c,dmg); if(SPECIAL[c.t]||c.t==='tower') c.tcd=Math.max(c.tcd||0,6); });
    smokes.push({x:t.x,y:t.y,R,t:6}); break; }
  case 'siege': {
    const strong=c=>c.t==='wall'||c.t==='tower'||c.t==='iron';
    hit(t,dmg*(strong(t)?4:1)); near(t.x,t.y,CS*1.1,c=>{ if(c!==t) hit(c,dmg*0.5*(strong(c)?4:1)); });
    fx.push({type:'ring',x:t.x,y:t.y,R:CS*1.3,t:0.3,T:0.3,col:'#c8a070'}); break; }
  case 'bounce': {
    const pts=[{x:u.x,y:u.y}]; let cur=t; const seen=new Set();
    for(let k=0;k<BF.bounces&&cur;k++){ seen.add(cur); hit(cur,dmg); pts.push({x:cur.x,y:cur.y});
      const pool=[]; near(cur.x,cur.y,CS*4.5,c=>{ if(!seen.has(c)&&Math.hypot(c.x-cur.x,c.y-cur.y)>CS*2) pool.push(c); });
      cur=pool.length?pool[Math.floor(Math.random()*pool.length)]:null; }
    fx.push({type:'bolt',pts,t:0.3,T:0.3,col:'#f0c0d0'}); break; }
  case 'flood': {
    const j0=Math.max(0,t.j-1), j1=Math.min(N-1,t.j+1);
    for(let j=j0;j<=j1;j++) for(let i=0;i<N;i++){ const c=grid[j*N+i]; if(c&&c.alive) hit(c,dmg); }
    fx.push({type:'band',y0:O+j0*CS,y1:O+(j1+1)*CS,t:0.6,T:0.6}); break; }
  }

}

// 주기 기술(고무·의병 소집·재정비): 실제 시간 기준으로 발동 (전투 중일 때만)
function periodicSkill(u,dt){
  const h=u.h, K=KIND[h.kind]; if(!K.every) return;
  if(u.sp===undefined||u.sp>60) u.sp=1;
  u.sp-=dt; if(u.sp>0) return;
  u.sp=skillGap(h);
  if(h.mech==='rally'){ troops.forEach(tr=>{ if(tr.dead>0) tr.dead=0.01; tr.hp=troopFull(tr); }); rallyT=BAL.rally_dur; fx.push({type:'ring',x:u.x,y:u.y,R:40,t:0.6,T:0.6,col:'#9fe0a0'}); }
  else if(h.mech==='heal'){ units.forEach(o=>{ if(o.dead>0) return; o.hp=Math.min(o.mhp,o.hp+o.mhp*BAL.heal_pct); fx.push({type:'ring',x:o.x,y:o.y,R:18,t:0.5,T:0.5,col:'#9fe0a0'}); }); troops.forEach(tr=>{ if(tr.hero&&tr.dead>0&&Math.hypot(tr.hero.x-u.x,tr.hero.y-u.y)<CS*10) tr.dead=0.01; }); fx.push({type:'ring',x:u.x,y:u.y,R:CS*10,t:0.6,T:0.6,col:'#9fe0a0'}); }
  else if(h.mech==='inspire'){ units.forEach(o=>{ o.haste=BAL.inspire_dur; fx.push({type:'ring',x:o.x,y:o.y,R:16,t:0.5,T:0.5,col:'#f3d98a'}); }); }
  else if(h.mech==='summon'){
    // 의병: 일반 보병보다 약한 민병대. 화살 한 발에 쓰러지고, 상한 인원까지 계속 유지
    const mine=minions.filter(m=>m.owner===u).length, n=Math.min(BF.summonN,BF.summonMax-mine);
    const dmg=TROOP_BASE*heroScale(h,S.heroes[h.name])*BAL.troop_dmg_ratio*BAL.militia_power;
    for(let k=0;k<n;k++){ const a=Math.random()*Math.PI*2; minions.push({minion:true,owner:u,id:'m',g:'병',col:'#6b5a3a',ring:'#d8c08a',range:20,x:u.x+Math.cos(a)*14,y:u.y+Math.sin(a)*14,cd:0.3,rt:0,target:null,dir:Math.random()<.5?1:-1,life:1e9,hp:1,dmg,haste:0}); }
    fx.push({type:'ring',x:u.x,y:u.y,R:24,t:0.5,T:0.5,col:'#d8c08a'});
  }
}

// 단계형 인연(정원보다 적은 인원으로도 발동)은 현재 인원을 로마 숫자로 표시: 오호대장 Ⅲ/Ⅳ/Ⅴ
const bondTiered=b=>b.m.length>b.need;
function bondLabel(b,team){ const c=bondCount(b,team||S.order); return bondTiered(b)&&c>=b.need?`${b.n} ${ROMAN[c]}`:b.n; }
let ultG={}, ultBuff={}, ultGold=0, ultGoldMult=1;
const ultBuffMult=name=>{ const t=ultBuff[name]; return t&&t.t>0?t.m:1; };
function ultPower(b){ const team=S.order, mem=b.m.filter(n=>team.includes(n)), c=mem.length; let s=0; mem.forEach(n=>{ s+=heroDmg(HBY[n],S.heroes[n]); }); return { c, mem, D:(s/Math.max(1,c))*BAL.ult_base*codexMult('ult')*(1+0.05*RU('ult_power'))*Math.pow(c,BAL.ult_pow) }; }
function ultTick(dt){
  if(ultGold>0){ ultGold-=dt; if(ultGold<=0) ultGoldMult=1; }
  for(const k in ultBuff){ ultBuff[k].t-=dt; if(ultBuff[k].t<=0) delete ultBuff[k]; }
  if(clearing>0||failing>0||remaining<=0) return;
  for(const b of activeBonds){
    const alive=units.some(u=>u.h&&b.m.includes(u.id)&&!(u.dead>0)); if(!alive) continue;
    if(ultG[b.id]===undefined) ultG[b.id]=Math.max(0,BAL.ult_start-0.17*activeBonds.indexOf(b));   // 여러 인연이 동시에 터지지 않게 엇갈림
    ultG[b.id]=Math.min(1,ultG[b.id]+dt/BAL.ult_charge*codexMult('charge')*(1+0.03*RU('ult_charge')));
  }
  // 필살기는 한 번에 하나씩. 간격 ult_gap 초(켜진 인연 2개 초과분마다 ult_gap_per_bond 초씩 짧아짐, 최소 ult_gap_min 초). 게이지가 찬 인연이 여럿이면 인원이 많은(강한) 인연부터

function moveUnit(u,dt,zoom){
  if(u.dash){ const d=u.dash; d.t+=dt; const k=Math.min(1,d.t/d.T); u.x=d.x0+(d.x1-d.x0)*k; u.y=d.y0+(d.y1-d.y0)*k; if(k>=1) u.dash=null; return; }   // 인연 필살기 돌격 중
  if(!u.minion){
    if(u.dead>0){ u.dead-=dt; if(u.dead<=0){ u.dead=0; u.hp=u.mhp; u.x=u.hx; u.y=u.hy; u.target=null; fx.push({type:'ring',x:u.x,y:u.y,R:20,t:0.6,T:0.6,col:'#9fe0a0'}); } return; }
    if(u.hurt>0) u.hurt-=dt;
    u.hp=Math.min(u.mhp,u.hp+u.mhp*regenPct(S.up.medic)/100*dt);
    u.ct-=dt;
    if(u.ct<=0){ u.ct=0.5; let n=0; near(u.x,u.y,CS*1.4,()=>n++); if(n) hurtUnit(u,n*BAL.contact_ratio*enemyAtk()*0.5); }
  }
  u.rt-=dt; if(u.haste>0) u.haste-=dt; if(u.buffT>0) u.buffT-=dt;
  if(!u.target||!u.target.alive||u.rt<=0){ u.target=nearest(u.x,u.y); u.rt=0.2; }
  const t=u.target;
  const rx=u.x-C, ry=u.y-C, rl=Math.hypot(rx,ry)||1;
  let vx=-ry/rl*32*zoom*u.dir, vy=rx/rl*32*zoom*u.dir;
  if(t){
    const dx=t.x-u.x, dy=t.y-u.y, d=Math.hypot(dx,dy)||1;
    const mr=u.mrange||u.range;   // 이동 기준 거리: 근접 장수는 기본 공격 거리, 그 외는 기술 사거리
    if(mr<9000){
      if(d>mr*0.85){ const sp=75*zoom*marchMult()*(u.h&&u.h.troop==='cav'?BAL.hero_cav_speed:1); vx+=dx/d*sp; vy+=dy/d*sp; if(u.h) u.moved=(u.moved||0)+sp*dt; }
      else if(d<mr*0.5){ vx-=dx/d*40; vy-=dy/d*40; }
    }
    u.cd-=dt*(u.haste>0?BAL.inspire_mult:1);
    if(u.cd<=0 && d<=u.range) act(u.minion?u.owner:u,()=>attack(u,t));
    if(u.h) act(u,()=>periodicSkill(u,dt)); else if(u.id==='lord') act(u,()=>lordSkills(u,dt));
    if(u.h && t.alive){ u.bcd=(u.bcd||0)-dt*(u.haste>0?BAL.inspire_mult:1); if(u.bcd<=0 && d<=(u.brange||u.range)){ u.bcd=BAL.basic_cd/(1+0.02*RU('basic_speed'))*(u.h.troop==='arch'?BAL.hero_arch_cd:1)*(0.9+Math.random()*0.2); act(u,()=>basicAttack(u,t)); } }
  }
  // 걸어서 이동할 때는 살아 있는 성 블록 칸으로 들어가지 못함 (벽을 따라 미끄러짐).
  // 돌격·순간이동으로 이미 블록 안에 있으면 빠져나올 수 있도록 자유 이동.
  const nx=Math.min(WORLD-12,Math.max(12,u.x+vx*dt)), ny=Math.min(WORLD-12,Math.max(12,u.y+vy*dt));
  const inside=blockedAt(u.x,u.y);
  if(inside){ u.x=nx; u.y=ny; return; }
  // 축별로 이동, 막히면 이동량을 반씩 줄여 벽 바로 앞까지 다가감
  for(let f=1;f>0.1;f*=0.5){ const x=u.x+(nx-u.x)*f; if(!blockedAt(x,u.y)){ u.x=x; break; } }
  for(let f=1;f>0.1;f*=0.5){ const y=u.y+(ny-u.y)*f; if(!blockedAt(u.x,y)){ u.y=y; break; } }
}
const UNIT_PAD=4;
function blockedAt(x,y){
  const i0=Math.floor((x-UNIT_PAD-O)/CS), i1=Math.floor((x+UNIT_PAD-O)/CS), j0=Math.floor((y-UNIT_PAD-O)/CS), j1=Math.floor((y+UNIT_PAD-O)/CS);
  for(let j=Math.max(0,j0);j<=Math.min(N-1,j1);j++) for(let i=Math.max(0,i0);i<=Math.min(N-1,i1);i++){ const c=grid[j*N+i]; if(c&&c.alive) return true; }
  return false;
}
function step(dt){

  if(rallyT>0) rallyT-=dt;
  for(let k=smokes.length-1;k>=0;k--){ smokes[k].t-=dt; if(smokes[k].t<=0) smokes.splice(k,1); }
  const zoom=WORLD/400;
  if(clearing>0){
    clearing-=dt;
    if(clearing<=0){ S.stage++; delete S.cleared; build(); save(); renderPanel(); }
  } else if(failing>0){
    failing-=dt;
    if(failing<=0){ S.stage=Math.max(1,S.stage-1); delete S.failed; build(); save(); renderPanel(); }
  } else {

      c.tcd= tt==='catapult'?4.5: tt==='archer'?2.6+Math.random()*0.6 : 2.2+Math.random()*0.6;

  }

    if(d<=mv){ earrows.splice(k,1); if(tr.minion){ tr.life=0; continue; } if(guarded(tr)||(RU('tower_resist')&&Math.random()<0.01*RU('tower_resist'))) continue; if(tr.mhp){ hurtUnit(tr,a.dmg||enemyAtk()); continue; } tr.hp--; if(tr.hp<=0){ tr.dead=(TROOP[tr.type].respawn||6)*(1-0.03*RU('troop_respawn')); if(fx.length<300) fx.push({type:'ring',x:tr.x,y:tr.y,R:8,t:0.4,T:0.4,col:'#c4472f'}); } }

}

// ---------- PixiJS(WebGL) 렌더러 ----------
// 화면 결과는 07-render.js 의 draw2d 와 같게 맞춤. 게임 로직은 건드리지 않음.
// 주의: bolt·strike 효과의 흔들림에 Math.random 을 draw2d 와 같은 횟수·순서로 사용 (시드 동등성 시험 유지용)
let PX=null;
const _cc=new Map();
function pc(css){ // CSS 색 → [0xRRGGBB, alpha]
  let v=_cc.get(css); if(v) return v;
  if(css[0]==='#'){ let h=css.slice(1); if(h.length===3) h=h.split('').map(c=>c+c).join(''); v=[parseInt(h,16),1]; }
  else { const m=css.match(/[\d.]+/g).map(Number); v=[(m[0]<<16)|(m[1]<<8)|m[2], m[3]===undefined?1:m[3]]; }
  _cc.set(css,v); return v;
}
function initPixi(){
  if(FORCE_2D || typeof PIXI==='undefined') return false;
  try{
    if(!PIXI.utils.isWebGLSupported()) return false;
    PIXI.settings.ROUND_PIXELS=false;
    const R=new PIXI.Renderer({view:cv,width:Math.max(1,cv.width),height:Math.max(1,cv.height),backgroundColor:0x1a2b22,antialias:true,resolution:1,autoDensity:false,powerPreference:'low-power'});

    const L=n=>{ const c=n==='g'?new PIXI.Graphics():new PIXI.Container(); world.addChild(c); return c; };
    PX={R,stage,world,ready:false,tex:{},
      ground:null, bgG:L('g'), underG:L('g'), cellL:L('c'), cellG:L('g'), fxG:L('g'), troopL:L('c'), unitG:L('g'), wpL:L('c'), unitL:L('c'), uiG:L('g'), textL:L('c'), floatL:L('c'),
      cellPool:[], troopPool:[], unitPool:[], wpPool:[], wpTex:{}, textPool:[], floatPool:[], bgKey:''};
    onResize=()=>{ if(PX) PX.R.resize(Math.max(1,cv.width),Math.max(1,cv.height)); };
    cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); },false);
    return true;
  }catch(e){ console.warn('WebGL 초기화 실패, 2D로 전환',e); PX=null; return false; }
}
// 글꼴 로딩 뒤(첫 프레임)에 텍스처를 만든다
function pxTexRes(){ return Math.min(6,Math.max(2,Math.ceil(cv.width/VIEW))); }
function pxCanvasTex(w,h,paint){
  const r=PX.res, c=document.createElement('canvas'); c.width=Math.ceil(w*r); c.height=Math.ceil(h*r);
  const x=c.getContext('2d'); x.scale(r,r); x.textAlign='center'; x.textBaseline='middle'; paint(x);
  return PIXI.Texture.from(c,{resolution:r});
}
function pxPrepare(){
  PX.res=pxTexRes(); PX.tex={cell:{},flash:{},troop:{},unit:{}};
  if(!PX.ground){ PX.ground=new PIXI.TilingSprite(PIXI.Texture.from(groundCanvas()),VIEW+CS*4,VIEW+CS*4); PX.world.addChildAt(PX.ground,0); }
  if(!PIXI.BitmapFont.available.flt) PIXI.BitmapFont.from('flt',{fontFamily:'Gowun Dodum',fontSize:48,fill:'#ffffff'},{chars:[['0','9'],'+-.,%만억조경해자양전사'],resolution:1,padding:2});
  PX.ready=true;
}
// 글꼴이 늦게 도착하면 글자 텍스처를 다시 만든다
function pxReset(){
  if(!PX||!PX.ready) return;
  for(const bank of Object.values(PX.tex)) for(const t of Object.values(bank)) t.destroy(true);
  for(const t of PX.floatPool) t.destroy(); PX.floatPool.length=0;
  if(PIXI.BitmapFont.available.flt) PIXI.BitmapFont.uninstall('flt');
  for(const t of PX.textPool) t.destroy(); PX.textPool.length=0;
  for(const p of [PX.cellPool,PX.troopPool,PX.unitPool]) for(const sp of p) sp.texture=PIXI.Texture.EMPTY;
  PX.ready=false;
}
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',()=>pxReset());
function pxCellTex(t,flash){
  const bank=flash?PX.tex.flash:PX.tex.cell; if(bank[t]) return bank[t];
  const T=TYPES[t], big=t==='lord', s=big?CS+4:CS-1.5;
  return bank[t]=pxCanvasTex(s,s,x=>{
    x.fillStyle=flash?'#f3e7c8':T.col; x.fillRect(0,0,s,s);
    if(SPECIAL[t]){ x.strokeStyle='#f0c070'; x.lineWidth=1.3; x.strokeRect(0.6,0.6,s-1.2,s-1.2); }
    if(big){ x.strokeStyle='#d9b25b'; x.lineWidth=1.2*2; x.strokeRect(0,0,s,s); }
    x.font=(big?14:10)+'px "Song Myung", serif'; x.fillStyle='rgba(239,230,210,.92)'; x.fillText(T.g,s/2,s/2+0.5);
  });
}
const TR0=4;
function pxTroopTex(tb,col,el,big){
  const k=tb+col+(el?1:0)+(big?'B':''), b=PX.tex.troop; if(b[k]) return b[k];
  const s=TR0*(big?1.7:1), half=s*1.5+3, w=half*2;
  return b[k]=pxCanvasTex(w,w,x=>{
    x.translate(half,half); x.fillStyle=col; x.strokeStyle=el?'#f0c070':'rgba(239,230,210,.75)'; x.lineWidth=el?1.3:0.8; x.beginPath();
    if(tb==='inf') x.rect(-s,-s,s*2,s*2);
    else if(tb==='cav'){ x.moveTo(s*1.5,0); x.lineTo(Math.cos(2.4)*s*1.2,Math.sin(2.4)*s*1.2); x.lineTo(Math.cos(-2.4)*s*1.2,Math.sin(-2.4)*s*1.2); x.closePath(); }
    else if(tb==='spear'){ x.moveTo(0,-s*1.4); x.lineTo(s*1.1,0); x.lineTo(0,s*1.4); x.lineTo(-s*1.1,0); x.closePath(); }
    else x.arc(0,0,s,0,Math.PI*2);
    x.fill(); x.stroke();
    if(big){ x.strokeStyle='rgba(239,230,210,.9)'; x.lineWidth=0.9; x.beginPath(); x.arc(0,0,s*0.45,0,Math.PI*2); x.stroke(); }   // 부대 표시(가운데 고리)
  });
}
const UR=10;
function pxUnitTex(u){
  const hurt=u.hurt>0, md=artMedal(u), k=u.g+'|'+u.col+'|'+u.ring+'|'+(hurt?1:0)+(md?'|m':''), b=PX.tex.unit; if(b[k]) return b[k];
  if(md){ const half=UR+4; return b[k]=pxCanvasTex(half*2,half*2,x=>{ x.translate(half,half); paintMedal(x,md,u,UR+1); }); }

    x.fillStyle=u.col; x.beginPath(); x.arc(half,half,UR,0,Math.PI*2); x.fill(); x.strokeStyle=u.ring; x.lineWidth=1.6; x.stroke();
    x.fillStyle=hurt?'#ff8a70':'#f6eedb'; x.font=(u.g.length>2?6.2:u.g.length>1?8:12)+'px "Song Myung", serif'; x.fillText(u.g,half,half+0.5);

}
function pxPool(pool,layer,make){ return i=>{ let o=pool[i]; if(!o){ o=make(); pool[i]=o; layer.addChild(o); } o.visible=true; return o; }; }
function pxHide(pool,n){ for(let i=n;i<pool.length;i++) if(pool[i].visible) pool[i].visible=false; }
// Graphics 도우미
function gLine(g,w,css,a){ const [c,al]=pc(css); g.lineStyle({width:w,color:c,alpha:al*(a===undefined?1:a),cap:PIXI.LINE_CAP.BUTT}); }
function gFill(g,css,a){ const [c,al]=pc(css); g.beginFill(c,al*(a===undefined?1:a)); }
function gArcStroke(g,x,y,r,a0,a1){ g.moveTo(x+Math.cos(a0)*r,y+Math.sin(a0)*r); g.arc(x,y,r,a0,a1); }
function gDashCircle(g,x,y,r,dash,gap,off){ const C2=Math.PI*2*r, n=Math.max(1,Math.floor(C2/(dash+gap))), st=Math.PI*2/n, da=st*dash/(dash+gap), o=off||0; for(let i=0;i<n;i++){ const a=o+i*st; gArcStroke(g,x,y,r,a,a+da); } }
function gDashRect(g,x,y,w,h){ g.drawRect(x,y,w,h); }
function gSeg(g,x0,y0,x1,y1){ g.moveTo(x0,y0); g.lineTo(x1,y1); }

function drawPixi(dt){
  clock+=dt;
  if(!PX.ready) pxPrepare();
  const W=cv.width, H=cv.height; scale=W/VIEW;
  const fu=followCam(dt);
  const wd=PX.world; const [shx,shy]=shakeOffset(dt); wd.scale.set(scale); wd.position.set(W/2-(camX+shx)*scale,H/2-(camY+shy)*scale);
  const vx0=camX-VIEW/2-CS, vx1=camX+VIEW/2+CS, vy0=camY-VIEW/2-CS, vy1=camY+VIEW/2+CS;
  // 바닥
  const gs=PX.ground; gs.position.set(vx0,vy0); gs.width=vx1-vx0; gs.height=vy1-vy0; gs.tilePosition.set(-vx0,-vy0);
  // 고정 배경 (성 크기 바뀔 때만 다시 그림)
  const bk=N+'|'+C+'|'+O;
  if(PX.bgKey!==bk){ PX.bgKey=bk; const g=PX.bgG; g.clear();
    gLine(g,1,'rgba(217,178,91,.14)'); gDashCircle(g,C,C,C-14,3,6);
    g.lineStyle(0); gFill(g,'rgba(30,50,60,.55)'); g.drawRect(O-8,O-8,N*CS+16,N*CS+16); g.endFill(); }
  // 셀 아래 효과

  for(const b of burns){ gFill(g,'#e8742f',Math.min(1,b.t)*0.28); g.drawCircle(b.x,b.y,b.R); g.endFill(); }
  for(const s of smokes){ gFill(g,'#b8b8b0',Math.min(1,s.t)*0.3); g.drawCircle(s.x,s.y,s.R); g.endFill(); }
  if(markCell&&markCell.alive){ gLine(g,2,'#ff6050',0.6+0.4*Math.sin(clock*8)); g.drawRect(markCell.x-CS*0.7,markCell.y-CS*0.7,CS*1.4,CS*1.4); g.lineStyle(0); }
  for(const c of curses){ const a=Math.min(1,c.t); gFill(g,'#9b6ad6',a*0.18); g.drawCircle(c.x,c.y,c.R); g.endFill(); gLine(g,1.2,'#b88cf0',a*0.5); gDashCircle(g,c.x,c.y,c.R,4,4); g.lineStyle(0); }
  // 성 블록
  const ci0=Math.max(0,Math.floor((vx0-O)/CS)), ci1=Math.min(N-1,Math.floor((vx1-O)/CS)), cj0=Math.max(0,Math.floor((vy0-O)/CS)), cj1=Math.min(N-1,Math.floor((vy1-O)/CS));

  let n=0;
  for(let cj=cj0;cj<=cj1;cj++) for(let ci=ci0;ci<=ci1;ci++){
    const c=grid[cj*N+ci]; if(!c||!c.alive) continue;
    const sp=getCell(n++), tex=pxCellTex(c.t,c.flash>0);
    if(sp.texture!==tex) sp.texture=tex;
    const big=c.t==='lord', s=big?CS+4:CS-1.5;
    sp.position.set(c.x,c.y); sp.width=s; sp.height=s;
    const f=c.hp/c.max, v=f<1?Math.round((1-0.45*(1-f))*255):255; sp.tint=v*0x010101;
    if(c.curse>0){ gFill(cg,'rgba(155,106,214,.35)'); cg.drawRect(c.x-s/2,c.y-s/2,s,s); cg.endFill(); }
    if(c.guard){ gFill(cg,'rgba(200,60,80,.22)'); cg.drawRect(c.x-s/2,c.y-s/2,s,s); cg.endFill(); }
  }

  for(const s of shots){ gLine(g,s.w,s.col); const dx=s.t.x-s.x, dy=s.t.y-s.y, d=Math.hypot(dx,dy)||1; gSeg(g,s.x-dx/d*7,s.y-dy/d*7,s.x,s.y); }
  for(const l of elobs){
    const p=l.t/l.T, x=l.x0+(l.x1-l.x0)*p, y=l.y0+(l.y1-l.y0)*p-Math.sin(p*Math.PI)*70;
    g.lineStyle(0); gLine(g,1,'#e0634a',0.35); g.drawCircle(l.x1,l.y1,CS*1.4);

  }
  for(const l of lobs){
    const p=l.t/l.T, x=l.x0+(l.x1-l.x0)*p, y=l.y0+(l.y1-l.y0)*p-Math.sin(p*Math.PI)*60;
    g.lineStyle(0); gFill(g,'rgba(0,0,0,.3)'); g.drawCircle(l.x0+(l.x1-l.x0)*p,l.y0+(l.y1-l.y0)*p,3); g.endFill();
    gLine(g,1,'#3a342a'); gFill(g,'#9a8f7a'); g.drawCircle(x,y,4.5); g.endFill();

  const offV=(x,y,r)=>x+r<vx0||x-r>vx1||y+r<vy0||y-r>vy1;
  for(const f of fx){
    if(f.x!==undefined&&f.type!=='flash'&&f.type!=='band'&&offV(f.x,f.y,(f.R||0)+CS*3)) continue;

    else if(f.type==='flash'){ gFill(g,f.col,q*(f.a||0.3)); g.drawRect(O-CS*4,O-CS*4,N*CS+CS*8,N*CS+CS*8); g.endFill(); }
    else if(f.type==='glow'){ gFill(g,f.col,q*0.55); g.drawCircle(f.x,f.y,f.R*(0.5+0.5*(1-q))); g.endFill(); gFill(g,'#fff6dc',q*0.8); g.drawCircle(f.x,f.y,Math.max(0.1,f.R*0.3*q)); g.endFill(); }
    else if(f.type==='fall'){ const hx=f.x-f.dx*q, hy=f.y-f.dy*q; gLine(g,2,f.col,Math.min(1,(1-q)*3)); gSeg(g,hx-f.dx*0.18,hy-f.dy*0.18,hx,hy); }

    else if(f.type==='slash'||f.type==='trail'){ const [c,al]=pc(f.col); const tr=f.type==='trail'; g.lineStyle({width:tr?CS*1.2*q:4*q+1,color:c,alpha:al*(tr?q*0.8:q),cap:ROUND}); gSeg(g,f.x0,f.y0,f.x1,f.y1); }
    else if(f.type==='ring'){ gLine(g,3,f.col,q); g.drawCircle(f.x,f.y,f.R*(0.3+0.7*(1-q))); }
    else if(f.type==='boom'){ gFill(g,'#f0a050',q*0.8); g.drawCircle(f.x,f.y,f.R*(0.4+0.6*(1-q))); g.endFill(); }

const WP_W=38, WP_H=20, WP_PX=7, WP_PY=10;   // 그림 크기(월드 단위)와 손잡이 위치

function wpShaft(x,a,b,w){ x.strokeStyle=DARK; x.lineWidth=(w||1.7)+1; x.beginPath(); x.moveTo(a,0); x.lineTo(b,0); x.stroke(); x.strokeStyle=WOOD; x.lineWidth=w||1.7; x.stroke(); }

    case 'twinhalberd': // 전위 쌍극: 짧은 극 두 자루

    case 'twin': // 유비 쌍고검: 검 두 자루

        wpFill(x,IRON,[[3,-1.1],[17,-0.9],[19.5,0],[17,0.9],[3,1.1]]); wpFill(x,GOLDC,[[2,-2.4],[3.4,-2.4],[3.4,2.4],[2,2.4]]); x.restore(); } break;

      x.strokeStyle='#efe6d2'; x.lineWidth=0.5; x.beginPath(); x.moveTo(13,-7); x.lineTo(9,0); x.lineTo(13,7); x.stroke(); wpFill(x,GOLDC,[[3,-2.2],[6,-2.2],[6,2.2],[3,2.2]]); break;
    case 'fan': { // 우선(깃털 부채)

      x.strokeStyle='rgba(239,230,210,.7)'; x.lineWidth=0.5; for(const yy of [-3,-1,1,3]){ x.beginPath(); x.moveTo(7,yy); x.lineTo(13,yy); x.stroke(); } break;

// 무기 동작: 공격 방식(skills.csv 의 모션 칸)에 맞춰 움직임.
//   slash 부채꼴로 휩쓸기 · cross 엇갈려 두 번 베기 · multislash 빠르게 세 번 베기 · thrust 앞으로 찌르기
//   frenzy 연속 찌르기 · smash 들어 올렸다 내려찍기 · spin 한 바퀴 돌리기 · shoot 겨누고 반동
//   throw 앞으로 내던지기 · cast 높이 들어 지휘(책략)
const MOTION_T={slash:0.28,cross:0.36,multislash:0.36,thrust:0.24,frenzy:0.3,smash:0.34,spin:0.45,shoot:0.22,throw:0.22,cast:0.5};
function motionOf(u){ return u.h? KIND[u.h.kind].motion : 'cast'; }
// 기본 공격은 무기에 맞는 짧은 동작(0.2초), 고유 기술은 기술 모션. 기술 동작 중에는 기본 공격 동작이 끼어들지 않음
const BASIC_MOTION={bow:'shoot',crossbow:'shoot',spear:'thrust',snake:'thrust',fan:'cast',book:'cast',staff:'cast',coin:'cast',knives:'throw'};
function startMotion(u,t,basic){
  if(basic && u.sw>0 && !u.mob) return;
  const m= basic? (u.h&&u.h.troop==='arch'&&!CAST_W[u.h.weapon]?'shoot':u.h&&u.h.troop==='cav'&&isMelee(u.h)?'thrust':(BASIC_MOTION[u.h&&u.h.weapon]||'slash')) : motionOf(u);
  u.mo=m; u.mob=!!basic; u.sw=u.swT= basic?0.2:MOTION_T[m]; u.swA=Math.atan2(t.y-u.y,t.x-u.x);

const ease=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function weaponPose(u,dt){
  if(u.sw>0) u.sw-=dt;
  const t=u.target, base=(t&&t.alive)? Math.atan2(t.y-u.y,t.x-u.x) : (u.wpA!==undefined?u.wpA:-Math.PI/4);
  let cur=u.wpA===undefined?base:u.wpA, d=base-cur; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; cur+=d*Math.min(1,dt*10); u.wpA=cur;
  const type=u.h?u.h.weapon:'sword', m=u.mo||motionOf(u), ranged=(type==='bow'||type==='crossbow');
  let a= ranged? cur : (m==='cast'? cur-1.0 : cur-0.6), off=0, hand=cur;   // 평소 자세
  if(u.sw>0){
    const p=Math.min(1,1-u.sw/u.swT), A=u.swA;
    switch(m){
      case 'slash': a=A-0.95+1.9*ease(p); break;                                   // 부채꼴 효과(±0.85)와 같은 범위를 휩쓸기
      case 'cross': a= p<0.5? A-0.9+1.8*ease(p*2) : A+0.9-1.8*ease(p*2-1); break;  // 왕복 두 번 베기
      case 'multislash': { const q=(p*3)%1; a=A+((Math.floor(p*3)%2)?0.8-1.6*q:-0.8+1.6*q); break; }
      case 'thrust': a=A; off=Math.sin(p*Math.PI)*9; break;                         // 목표 쪽으로 쭉 찌르기
      case 'frenzy': a=A+Math.sin(p*9)*0.12; off=Math.abs(Math.sin(p*Math.PI*3))*7; break;
      case 'smash': a= p<0.45? A-1.7*ease(p/0.45) : A-1.7+2.0*ease(Math.min(1,(p-0.45)/0.25)); break; // 들어 올렸다 내려찍기
      case 'spin': a=A+p*Math.PI*2; hand=A+p*Math.PI*2; break;                      // 몸 주위로 한 바퀴
      case 'shoot': a=A; off=-Math.sin(p*Math.PI)*3; break;                          // 반동
      case 'throw': a=A-1.3+1.9*ease(p); off=Math.sin(p*Math.PI)*5; break;
      case 'cast': a=A-1.25+Math.sin(p*Math.PI*2)*0.25; off=2; break;               // 높이 들고 흔들기
    }
  }
  const ur=10, hx=u.x+Math.cos(hand+1.3)*ur*0.75+Math.cos(a)*off, hy=u.y+Math.sin(hand+1.3)*ur*0.75+Math.sin(a)*off;
  return {type,a,x:hx,y:hy};
}

// 게임 로직의 난수(Math.random)는 쓰지 않음 → 소리 유무와 관계없이 게임 결과 동일.
const SFX={ctx:null,out:null,last:{},n:0};
function sfxInit(){
  if(SFX.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SFX.ctx=new AC(); SFX.out=SFX.ctx.createGain(); SFX.out.gain.value=0.5; SFX.out.connect(SFX.ctx.destination); }catch(e){ SFX.ctx=null; }
}
document.addEventListener('pointerdown',()=>{ sfxInit(); if(SFX.ctx&&SFX.ctx.state==='suspended') SFX.ctx.resume(); },{passive:true});
let _noiseBuf=null;
function noiseBuf(a){ if(_noiseBuf) return _noiseBuf; const b=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate), d=b.getChannelData(0); let s=1234567; for(let i=0;i<d.length;i++){ s=(s*1103515245+12345)&0x7fffffff; d[i]=s/0x3fffffff-1; } return _noiseBuf=b; }
function tone(a,t,f0,f1,dur,type,vol){
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(SFX.out); o.start(t); o.stop(t+dur+0.02);
}
function noise(a,t,dur,vol,freq,ftype){
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=noiseBuf(a); f.type=ftype||'bandpass'; f.frequency.value=freq; f.Q.value=0.8;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); s.connect(f); f.connect(g); g.connect(SFX.out); s.start(t,(SFX.n++%7)*0.05); s.stop(t+dur+0.02);
}
// 이름: [최소 간격(초), 만드는 법]
const SFX_DEF={

  skill:[0.12,(a,t)=>noise(a,t,0.16,0.10,1400)],
  big:[0.18,(a,t)=>{ tone(a,t,110,38,0.32,'sine',0.45); noise(a,t,0.22,0.16,300,'lowpass'); }],
  gold:[0.25,(a,t)=>{ tone(a,t,1320,0,0.09,'triangle',0.08); tone(a,t+0.06,1760,0,0.12,'triangle',0.07); }],
  clear:[0.5,(a,t)=>{ [523,659,784,1047].forEach((f,i)=>tone(a,t+i*0.09,f,0,0.22,'triangle',0.14)); }],
  gate:[0.5,(a,t)=>{ [392,523,659,784,1047,1319].forEach((f,i)=>tone(a,t+i*0.08,f,0,0.3,'triangle',0.15)); tone(a,t,98,0,1.4,'sine',0.35); }],

  ui:[0.04,(a,t)=>tone(a,t,880,1100,0.05,'sine',0.07)],
  recruit:[0.3,(a,t)=>{ tone(a,t,523,0,0.12,'triangle',0.12); tone(a,t+0.1,784,0,0.2,'triangle',0.12); }],
  rebirth:[0.8,(a,t)=>{ tone(a,t,110,0,1.8,'sine',0.45); tone(a,t,220,0,1.2,'sine',0.18); tone(a,t,331,0,0.9,'sine',0.1); }]
};
function sfx(name){
  if(!SFX.ctx||(typeof S!=='undefined'&&S&&S.mute)||SFX.ctx.state!=='running') return;
  const d=SFX_DEF[name]; if(!d) return; const t=SFX.ctx.currentTime;
  if(t-(SFX.last[name]||-9)<d[0]) return; SFX.last[name]=t;

}

// ===== 09-recruit.js =====
// ---------- recruit ----------
const slots=()=>slotsOf(S);
const isBondSlot=k=>k>=baseSlotsOf(S);
const ownedCount=()=>S.order.length;
const recruitCost=k=>Math.ceil(BAL.recruit_base*Math.pow(BAL.recruit_growth,k));
const slotCostMult=k=>Math.pow(BAL.slot_cost_growth,k);
const levelCost=(lv,k)=>Math.ceil(BAL.level_base*slotCostMult(k)*Math.pow(BAL.level_growth,lv-1)*supplyMult(S.up.supply));
// 이번 회차에 한 번이라도 후보로 나왔던 장수(S.seen)는 다시 나오지 않음. 회군하면 초기화.
// (후보가 모자라면 예외적으로 이미 나왔던 장수도 포함)
// 같은 인연에 속한 두 장수는 한 번에 후보로 같이 나오지 않음 (양자택일로 인연이 막히는 것 방지)
const bondMates=n=>{ const s=new Set(); BONDS.forEach(b=>{ if(b.m.includes(n)) b.m.forEach(m=>{ if(m!==n) s.add(m); }); }); return s; };
const GRADE_W={영웅:1,명장:2,일반:3}, GRADE_C={영웅:'#ff9a50',명장:'#a0b8ff',일반:'#b8b0a0'};
const gradeTag=h=>`<span class="grade" style="--gc:${GRADE_C[h.grade]}">${h.grade}</span>`;
function rollOne(exclude){
  const ex=[].concat(exclude||[]), seen=new Set(S.seen||[]), mates=new Set(); ex.forEach(e=>bondMates(e).forEach(m=>mates.add(m)));
  const banned=new Set((S.fame&&S.fame.banned)||[]);
  let base=HEROES.filter(h=>!S.heroes[h.name] && !ex.includes(h.name) && !banned.has(h.name));
  if(!base.length) base=HEROES.filter(h=>!S.heroes[h.name] && !ex.includes(h.name));   // 제외 장수 때문에 후보가 없으면 제외 무시
  let pool=base.filter(h=>!seen.has(h.name)&&!mates.has(h.name));
  if(!pool.length) pool=base.filter(h=>!seen.has(h.name));
  if(!pool.length) pool=base.filter(h=>!mates.has(h.name));
  if(!pool.length) pool=base;
  // 등급별 등장 가중치: 영웅은 드물게
  if(!pool.length) return null; let sum=0; for(const h of pool) sum+=GRADE_W[h.grade]||2; let x=Math.random()*sum; for(const h of pool){ x-=GRADE_W[h.grade]||2; if(x<0) return h.name; } return pool[pool.length-1].name;
}
function recruit(k){
  if(S.pending||k!==ownedCount()||k>=slots()) return;
  const c=recruitCost(k); if(S.gold<c) return;
  const cand=rollCands(); if(!cand.length) return;
  S.gold-=c; S.pulls++;
  S.pending=cand; S.rerolled=0; S.seen=(S.seen||[]).concat(S.pending); save(); showPick();
}
// 다시 뽑기: 등용 1번마다 1회 무료(명성 「다시 뽑기 추가」로 늘어남). 넘긴 두 장수는 이번 회차에 다시 나오지 않음(이미 본 장수로 처리)
// 후보 수: 기본 2명, 명장 추천 습득 시 3명 (서로 같은 인연 장수는 함께 나오지 않음)
// 인연 등용 후보: 지금 출전 장수와 인연을 이룰 수 있는 장수만. 인연을 '완성'시키는 장수일수록 잘 나옴
function rollBondCands(n){
  const own=new Set(S.order), banned=new Set(S.fame.banned||[]), w={};
  for(const b of BONDS){ const c=bondCount(b,S.order); if(!c) continue; for(const m of b.m){ if(own.has(m)||banned.has(m)) continue; w[m]=(w[m]||0)+(c+1>=b.need?b.need**3:c); } }
  const out=[]; let pool=Object.keys(w);
  for(let i=0;i<n&&pool.length;i++){ let sum=0; pool.forEach(p=>sum+=w[p]); let x=Math.random()*sum, pick=pool[pool.length-1]; for(const p of pool){ x-=w[p]; if(x<0){ pick=p; break; } } out.push(pick); pool=pool.filter(p=>p!==pick); }
  return out;
}
function rollCands(){ const n=2+(S.fame.scout||0)+((S.up&&S.up.extra_cand)||0);
  if(isBondSlot(ownedCount())){ const bc=rollBondCands(Math.max(3,n)); if(bc.length) return bc; }
  return rollCandsNormal(n); }
function rollCandsNormal(n0){ const n=n0, out=[]; for(let i=0;i<n;i++){ const x=rollOne(out); if(!x) break; out.push(x); } return out; }
const rerollMax=()=>1+(S.fame.reroll||0)+((S.up&&S.up.free_reroll)||0);
function reroll(){
  if(!S.pending||(S.rerolled||0)>=rerollMax()) return;
  const cand=rollCands(); if(!cand.length) return;
  S.pending=cand; S.rerolled=(S.rerolled||0)+1; S.seen=(S.seen||[]).concat(S.pending); save(); sfx('recruit'); showPick();
}
function choose(name){
  if(S.heroes[name]||ownedCount()>=slots()) return;
  S.heroes[name]=1+(S.fame.mentor||0); S.order.push(name);
  S.pending=null; save(); buildUnits(false); $('pick').hidden=true; renderPanel(); sfx('recruit');
}
function levelUp(name,k){
  const lv=S.heroes[name], c=levelCost(lv,k); if(S.gold<c) return;
  S.gold-=c; S.heroes[name]=lv+1; save(); buildUnits(false); renderPanel();
}
// 일괄 강화: 가장 싼 강화부터 금이 모자랄 때까지 반복 (dry=true 면 횟수만 계산)
function bulkLevel(dry,quiet){
  const lv={}; S.order.forEach(n=>lv[n]=S.heroes[n]); let g=S.gold, n=0;
  const cap=dry?999:10000; while(n<cap){ let best=null; S.order.forEach((nm,k)=>{ const c=levelCost(lv[nm],k); if(c<=g&&(!best||c<best.c)) best={c,nm}; }); if(!best) break; g-=best.c; lv[best.nm]++; n++; }
  if(!dry&&n){ S.gold=g; S.order.forEach(nm=>S.heroes[nm]=lv[nm]); save(); buildUnits(false); if(!quiet){ renderPanel(); sfx('ui'); } }
  return n;
}
// 일괄 연구: 열린 연구 중 가장 싼 것부터 반복 (도중에 다음 단계가 열리면 그 연구도 포함)
function bulkResearch(dry,quiet){
  const real=S.up; S.up=Object.assign({},real); let g=S.gold, n=0; const cap=dry?999:10000;
  while(n<cap){ let best=null; const mt=maxOpenTier(); UPS.forEach(u=>{ if(u.tier>mt) return; const l=S.up[u.id]||0; if(l>=u.max) return; const c=upCost(u,l); if(c<=g&&(!best||c<best.c)) best={c,u}; });
    if(!best) break; g-=best.c; S.up[best.u.id]=(S.up[best.u.id]||0)+1; n++; }
  if(dry||!n){ S.up=real; return n; }
  S.gold=g; save(); buildUnits(false); if(!quiet){ renderPanel(); sfx('ui'); } return n;
}

const fmtX=x=>x<100?x.toFixed(2):fmt(x);
function startGold(l){ return l? BAL.start_gold_k*Math.pow(BAL.start_gold_growth,l) : 0; }
function rebirth(){
  const pts=famePts(); if(!pts) return;
  const fame=S.fame; fame.pts+=pts; fame.total+=pts; fame.count++;
  const best=Math.max(S.best||1,S.stage);
  const keep={speed:S.speed,mute:S.mute,tips:S.tips,gps:S.gps};
  const keepUp=(S.up&&S.up.keep_research)?Object.fromEntries(Object.entries(S.up).map(([k,v])=>[k,k==='keep_research'?v:Math.floor(v*0.2)])):null;   // 연구 유산
  S=fresh(); Object.assign(S,keep); if(keepUp) Object.assign(S.up,keepUp); S.fame=fame; S.best=best; S.gold=startGold(fame.start); sfx('rebirth'); addShake(3); lastEarned=0; setTimeout(()=>toast(`명성 +${fmt(pts)} 획득. 회군 탭에서 영구 강화를 사세요 (출전 자리를 늘리면 장수 여럿으로 시작합니다).`),300);
  units=[]; clearing=0; ultReset(); build(); save(); showPick(); renderPanel();
}

function armButton(btn,label,armedLabel,fn){
  let armed=0, armedAt=0;
  btn.addEventListener('click',()=>{
    if(btn.disabled) return;
    if(!armed){ armed=setTimeout(()=>{armed=0;btn.classList.remove('arm');btn.innerHTML=label();},3000); armedAt=performance.now(); btn.classList.add('arm'); btn.innerHTML=armedLabel; return; }
    if(performance.now()-armedAt<450) return;   // 더블클릭으로 바로 확정되는 것 방지
    clearTimeout(armed); armed=0; btn.classList.remove('arm'); fn();
  });
}
function upItem(list,u,lvGet,costFn,canPay,pay,descFn,max,unit,locked){
  const el=document.createElement('div'); el.className='item';
  el.innerHTML=`<div class="seal" style="background:${u.col};border-color:${u.col}">${u.g}</div><div class="info"><h3>${u.name}<span></span></h3>${max<999?'<i class="lvbar"><b></b></i>':''}<p></p></div><div class="btns"><button class="buy max" aria-label="${u.name} 가능한 만큼 강화"></button><button class="buy one"></button></div>`;
  const btn=el.querySelector('.one'), mbtn=el.querySelector('.max'), p=el.querySelector('p'), sp=el.querySelector('h3 span');
  const bar=el.querySelector('.lvbar b');
  const after=()=>{ sfx('ui'); save(); if(['slot','levy','armor','dmg','medic','conscript','fort','lord'].includes(u.id)||u.fx==='hp') buildUnits(false); refresh(); };
  btn.addEventListener('click',()=>{ if(locked&&locked()) return; const l=lvGet(), c=costFn(l); if(l<max&&canPay(c)){ pay(c,l); after(); } });
  // 최대 구매: 살 수 있는 만큼 연속 강화
  mbtn.addEventListener('click',()=>{ if(locked&&locked()) return; let n=0; for(;n<10000;n++){ const l=lvGet(), c=costFn(l); if(l>=max||!canPay(c)) break; pay(c,l); } if(n) after(); });
  refs.push(()=>{
    const l=lvGet(), c=costFn(l), mx=l>=max, lk=!!(locked&&locked());
    el.classList.toggle('locked',lk);
    if(bar){ bar.style.width=Math.min(100,l/max*100).toFixed(1)+'%'; bar.parentNode.classList.toggle('full',mx); }
    if(lk){ sp.textContent='Lv.'+l+'/'+max; p.innerHTML=descFn(l); btn.innerHTML='잠김<strong>—</strong>'; btn.disabled=true; mbtn.hidden=true; return; }
    sp.textContent=mx?'Lv.'+l+' 최대':'Lv.'+l+(max<999?'/'+max:'');
    p.innerHTML=descFn(l);
    btn.innerHTML= mx ? '완료<strong>—</strong>' : `강화<strong>${unit} ${fmt(c)}</strong>`;
    btn.disabled=mx||!canPay(c);
    // 연속 구매 가능 단계 수 (보유량으로 시뮬레이션, 최대 999)
    let n=0; if(!mx&&canPay(c)){ let lv=l, sum=0; const have=unit==='명성'?S.fame.pts:S.gold; while(n<999&&lv<max){ const cc=costFn(lv); if(sum+cc>have) break; sum+=cc; lv++; n++; } }
    mbtn.hidden=n<2; mbtn.innerHTML=`최대<strong>+${n}</strong>`;
  });
  list.appendChild(el);
}
// 장수 탭 맨 위 「다음 목표」 한 줄: 지금 할 수 있는 것 → 곧 닿는 것 → 다음 이정표 순

function nextGoal(){
  const k=ownedCount(), main=[];
  if(S.pending) return '<b>다음 목표</b> 등용할 장수를 골라 주세요';
  if(k<slots()){ const c=recruitCost(k); const near=BONDS.filter(b=>{ const x=bondCount(b,S.order); return x>=1&&x===b.need-1; })[0];
    return `<b>다음 목표</b> ${isBondSlot(k)?'🔗 인연 등용 자리':'빈 자리'}에 장수 등용${S.gold>=c?' <em>지금 가능</em>':` · 금 ${fmt(c)}`}${near?` · 「${near.n}」까지 1명`:''}`; }
  let best=null; S.order.forEach((n,i)=>{ const o=costToMile(n,i); if(o&&(!best||o.c<best.c)) best=o; });
  const sub=[]; const rb=S.runBest||0, ns=(Math.floor(rb/BAL.bond_slot_every)+1)*BAL.bond_slot_every; sub.push(`제${ns}전 도달 시 🔗 인연 등용 자리 +1`);
  const ng=(Math.floor(S.stage/BAL.gate_every)+(isGate(S.stage)?0:1))*BAL.gate_every; sub.push(`제${ng}전 「${stageName(ng)}」 명소 공성전`);
  return `<b>다음 목표</b> `+(best?`${best.n} Lv.${best.nm} 돌파 → 피해 2배 ${S.gold>=best.c?'<em>지금 가능</em>':`· 금 ${fmt(best.c)} 필요`}`:'장수를 강화하세요')+`<small>${sub.join(' · ')}</small>`;
}

    if(tab==='up') renderPanel(); else highlight('#tab-up'); }
  else if(tab==='up'&&shownTier&&(UP_TIERS.find(x=>!tierOpen(x))||UP_TIERS[UP_TIERS.length-1])!==shownTier) renderPanel();
  lastTier=t;
}
function guideTick(){
  if(!S) return; tierWatch(); researchAuto(0.25); const T=S.tips||{};
  const owned=S.order.length;
  if(!owned && !T.recruit && S.gold>=recruitCost(0)){ if(tab!=='gen'){ tab='gen'; renderPanel(); } tip('recruit','금이 모였습니다. 아래 「등용」을 눌러 첫 장수를 맞아들이세요.',document.querySelector('.list .buy.ready')); return; }
  if(owned>=1 && !T.levelup && S.gold>=levelCost(S.heroes[S.order[0]]||1,0) && !S.pending){ tip('levelup','장수를 「강화」하면 레벨이 오릅니다. Lv.10·25·50·100을 넘길 때마다 피해가 2배가 됩니다.'); return; }
  if(!T.touch && S.kills>=15){ tip('touch','성 블록을 직접 눌러도 주군이 공격합니다. 급할 때 눌러 보세요.'); return; }
  if(owned>=1 && !T.upgrade && (S.stage>=3 || UPS.some(u=>tierOpen(u.tier)&&S.gold>=upCost(u,S.up[u.id]||0)&&S.gold<levelCost(S.heroes[S.order[0]]||1,0)))){ tip('upgrade','「군비 강화」 탭에서 주군 공격력과 금 획득량을 올릴 수 있습니다.','#tab-up'); return; }
  if(S.stage>=BAL.fame_min_stage && !T.fame && !(S.fame&&S.fame.count)){ tip('fame',`제${BAL.fame_min_stage}전부터 「회군」하면 명성을 얻어 영구 강화를 살 수 있습니다. 막히면 회군하세요.`,'#tab-fame'); return; }
}
// 지금 살 수 있는 가장 싼 강화 (장수 강화·군비 강화 중)
function cheapestBuy(){
  let best=null;
  S.order.forEach((n,k)=>{ const c=levelCost(S.heroes[n],k); if(S.gold>=c&&(!best||c<best.c)) best={c,name:n,tab:'gen',idx:k}; });
  UPS.forEach((u,i)=>{ const l=S.up[u.id]||0; if(l>=u.max||!tierOpen(u.tier)) return; const c=upCost(u,l); if(S.gold>=c&&(!best||c<best.c)) best={c,name:u.name,tab:'up',idx:i}; });
  return best;
}

// 저장: 닉네임·로그인 토큰은 게임 저장과 별도 키(chunha-rank)에 둠 → 회군·초기화와 무관하게 유지.
const RK={cfg:FIREBASE_CFG, on:!!(FIREBASE_CFG&&FIREBASE_CFG.apiKey&&FIREBASE_CFG.projectId)&&!window.__norank, st:null, list:null, mine:null, err:'', at:0, busy:false, sentBest:0, sentAt:0};
function rkLoad(){ if(RK.st) return RK.st; try{ RK.st=JSON.parse(localStorage.getItem('chunha-rank')||'{}'); }catch(e){ RK.st={}; } return RK.st; }
function rkSave(){ try{ localStorage.setItem('chunha-rank',JSON.stringify(RK.st)); }catch(e){} }
const rkNick=()=>(rkLoad().nick||'').trim();
const FS=()=>`https://firestore.googleapis.com/v1/projects/${RK.cfg.projectId}/databases/(default)/documents`;
async function rkJson(url,opt){ const r=await fetch(url,opt); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&(j.error.message||j.error.status))||('HTTP '+r.status)); return j; }
// 익명 로그인: 처음엔 계정 생성, 이후엔 저장된 refreshToken 으로 갱신 (토큰은 약 1시간 유효)
async function rkAuth(){
  const s=rkLoad(), key=RK.cfg.apiKey;
  if(s.idToken&&s.exp>Date.now()+60000) return s;
  if(s.refresh){ try{ const j=await rkJson(`https://securetoken.googleapis.com/v1/token?key=${key}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refresh)});
      s.idToken=j.id_token; s.refresh=j.refresh_token; s.uid=j.user_id; s.exp=Date.now()+(+j.expires_in||3600)*1000; rkSave(); return s; }catch(e){ /* 만료 시 새 계정 */ } }
  const j=await rkJson(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  s.idToken=j.idToken; s.refresh=j.refreshToken; s.uid=j.localId; s.exp=Date.now()+(+j.expiresIn||3600)*1000; rkSave(); return s;
}
// 내 기록 올리기 (기록이 올랐을 때만, 최소 60초 간격). 닉네임이 없으면 올리지 않음
async function rkSubmit(force){
  if(!RK.on||!rkNick()) return; const best=Math.max(S.best||1,S.stage);
  if(!force&&(best<=RK.sentBest||Date.now()-RK.sentAt<60000)) return;
  RK.sentAt=Date.now();
  try{ const a=await rkAuth();
    const body={fields:{name:{stringValue:rkNick().slice(0,12)},best:{integerValue:String(best)},codex:{integerValue:String(codexN())},awake:{integerValue:String(HEROES.filter(h=>isAwake(h.name)).length)},fame:{integerValue:String(Math.min(Number.MAX_SAFE_INTEGER,Math.floor(S.fame.total||0)))},updated:{timestampValue:new Date().toISOString()}}};
    const mask=['name','best','codex','awake','fame','updated'].map(f=>'updateMask.fieldPaths='+f).join('&');
    await rkJson(`${FS()}/rankings/${a.uid}?${mask}`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.idToken},body:JSON.stringify(body)});
    RK.sentBest=best; RK.err=''; }
  catch(e){ RK.err='기록 전송 실패: '+e.message; }
}
const fv=f=>f?(f.integerValue!==undefined?+f.integerValue:f.stringValue!==undefined?f.stringValue:f.doubleValue):undefined;
// 상위 50명 + 내 순위(나보다 높은 기록 수 + 1)
async function rkFetch(){

    const q={structuredQuery:{from:[{collectionId:'rankings'}],orderBy:[{field:{fieldPath:'best'},direction:'DESCENDING'}],limit:50}};
    const res=await rkJson(`${FS()}:runQuery`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)});

    const s=rkLoad(), my=Math.max(S.best||1,S.stage);

      const n=c[0]&&c[0].result&&c[0].result.aggregateFields&&c[0].result.aggregateFields.n; RK.mine=n?(+n.integerValue)+1:null; }

  }catch(e){ RK.err='랭킹을 불러오지 못했습니다 ('+e.message+')'; }

// ===== 11d-chat.js =====
// ---------- 채팅 + 전장 소식 (Firebase Firestore REST) ----------
// 컬렉션 chat: {uid,name,text,type:'msg'|'news',ts}. 서버 규칙으로 3초에 1개만 쓰기 가능(chatmeta/{uid}.last).
// 금칙어·전화번호·링크는 보내기 전에 가림. 신고는 reports 컬렉션에 쌓이고(콘솔에서 확인), 차단은 이 기기에서만 숨김.
const CH={items:[], lastTs:'', timer:0, open:false, sentAt:0, newsAt:0, busy:false, err:''};
const BAD=['시발','씨발','씨팔','시팔','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','븅신','개새','새끼','좆','존나','졸라','지랄','ㅈㄹ','미친놈','미친년','닥쳐','꺼져','엠창','니애미','느금','애미','애비','썅','fuck','shit','bitch'];
function chatClean(t){
  t=String(t||'').replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().slice(0,80);
  const low=t.toLowerCase(); let out=t;
  for(const w of BAD){ let i=low.indexOf(w); while(i>=0){ out=out.slice(0,i)+'●'.repeat(w.length)+out.slice(i+w.length); i=low.indexOf(w,i+w.length); } }
  out=out.replace(/(https?:\/\/|www\.)\S+|\S+\.(com|net|kr|io|co|me|ly|gg)\b\S*/gi,'(링크 차단)').replace(/\d[\d\s-]{6,}\d/g,'(번호 차단)');
  return out;
}
const chBlocked=()=>{ const s=rkLoad(); return s.blocked||(s.blocked=[]); };
const rid=()=>{ const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s=''; for(let i=0;i<20;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
const docPath=(c,id)=>`projects/${RK.cfg.projectId}/databases/(default)/documents/${c}/${id}`;
// 글 쓰기: 채팅 글 + 내 마지막 전송 시각을 한 번에 기록(서버가 3초 간격 검사)
async function chatPost(text,type){
  if(!RK.on) return false; const nick=rkNick(); if(!nick){ showNick(); return false; }
  const a=await rkAuth();
  const body={writes:[
    {update:{name:docPath('chat',rid()),fields:{uid:{stringValue:a.uid},name:{stringValue:nick.slice(0,12)},text:{stringValue:text},type:{stringValue:type}}},currentDocument:{exists:false},updateTransforms:[{fieldPath:'ts',setToServerValue:'REQUEST_TIME'}]},
    {update:{name:docPath('chatmeta',a.uid),fields:{}},updateTransforms:[{fieldPath:'last',setToServerValue:'REQUEST_TIME'}]}]};
  await rkJson(`${FS()}:commit`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.idToken},body:JSON.stringify(body)});
  return true;
}
async function chatSend(){
  const ip=$('chat-in'); if(!ip) return; const t=chatClean(ip.value); if(!t) return;
  if(Date.now()-CH.sentAt<3000){ toast('잠시 후에 다시 보내 주세요 (3초에 1번)'); return; }
  CH.sentAt=Date.now(); ip.value='';

}
// 전장 소식: 큰 사건만 자동으로 알림 (같은 기기에서 60초에 1번까지)
// 전장 소식은 채팅창에 올리지 않음(사용자 요청). 함수는 남겨 두고 바로 종료
function chatNews(text){ return; if(!RK.on||!rkNick()||Date.now()-CH.newsAt<60000) return; CH.newsAt=Date.now(); chatPost(chatClean(text),'news').catch(()=>{}); }
// 새 글 가져오기: 처음엔 최근 40개, 이후엔 마지막으로 본 글 이후만
async function chatFetch(){
  if(!RK.on||CH.busy||Date.now()<(CH.pauseUntil||0)) return; CH.busy=true;
  try{
    const q={from:[{collectionId:'chat'}],orderBy:[{field:{fieldPath:'ts'},direction:CH.lastTs?'ASCENDING':'DESCENDING'}],limit:40};
    if(CH.lastTs) q.where={fieldFilter:{field:{fieldPath:'ts'},op:'GREATER_THAN',value:{timestampValue:CH.lastTs}}};
    const res=await rkJson(`${FS()}:runQuery`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:q})});
    let all=res.filter(r=>r.document).map(r=>{ const f=r.document.fields||{}; return {id:r.document.name.split('/').pop(),uid:fv(f.uid),name:fv(f.name)||'무명',text:fv(f.text)||'',type:fv(f.type)||'msg',ts:f.ts&&f.ts.timestampValue}; });
    if(!CH.lastTs) all.reverse();
    // 마지막으로 본 시각은 소식 글까지 포함해 갱신 (그래야 다음부터 새 글만 읽음 → 읽기 횟수 절약)
    const first=!CH.lastTs; for(const m of all) if(m.ts&&(!CH.lastTs||m.ts>CH.lastTs)) CH.lastTs=m.ts;
    if(!CH.lastTs) CH.lastTs=new Date(Date.now()-86400000).toISOString();
    let got=all.filter(m=>m.ts&&m.type!=='news'&&!CH.items.some(x=>x.id===m.id));
    if(got.length){ CH.items=CH.items.concat(got).slice(-80);
      if(!first&&!CH.open){ const m=got.filter(x=>!chBlocked().includes(x.uid)).pop(); if(m) chatTicker(m); } }
    CH.err='';
  }catch(e){ const q=/quota|RESOURCE_EXHAUSTED|429/i.test(e.message); if(q) CH.pauseUntil=Date.now()+600000;
    CH.err=q?'채팅 서버 사용량이 많아 잠시 쉬는 중입니다 (10분 뒤 다시 시도)':'채팅을 불러오지 못했습니다 ('+e.message+')'; }
  CH.busy=false; if(CH.open) renderChat();
}
// 창이 닫혀 있을 때 새 글을 전장 위쪽에 잠깐 띄움
function chatTicker(m){ const el=$('ticker'); if(!el) return; el.innerHTML=m.type==='news'?`<i>📯</i> ${m.text}`:`<b>${m.name}</b> ${m.text}`; el.classList.toggle('news',m.type==='news'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
function renderChat(){
  const box=$('chat-list'); if(!box) return; const s=rkLoad(), bl=chBlocked();
  if(!RK.on){ box.innerHTML='<p class="rk-note">채팅 서버가 연결되지 않았습니다.</p>'; return; }

  box.innerHTML=(CH.err?`<p class="rk-note rk-err">${CH.err}</p>`:'')+(CH.items.filter(m=>!bl.includes(m.uid)).map(m=>{ const t=new Date(m.ts), hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    return m.type==='news'?`<div class="cm news"><span>📯 ${m.text}</span><em>${hm}</em></div>`:`<div class="cm${m.uid===s.uid?' me':''}" data-id="${m.id}"><b>${m.name}</b><span>${m.text}</span><em>${hm}</em></div>`; }).join('')||'<p class="rk-note">아직 글이 없습니다. 첫 인사를 남겨 보세요!</p>');
  if(near||!CH.rendered){ box.scrollTop=box.scrollHeight; CH.rendered=1; }

// 글을 누르면 신고·차단 메뉴 (내 글 제외)
function chatMenu(m){

    if(a==='rep'){ try{ const au=await rkAuth(); await rkJson(`${FS()}/reports?documentId=${rid()}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+au.idToken},body:JSON.stringify({fields:{msg:{stringValue:m.id},target:{stringValue:m.uid||''},reporter:{stringValue:au.uid},text:{stringValue:m.text.slice(0,80)},ts:{timestampValue:new Date().toISOString()}}})});

function openChat(){ const m=$('chatm'); if(!m) return; if(RK.on&&!rkNick()){ showNick(); return; } m.hidden=false; CH.open=true; CH.rendered=0; sfx('ui'); renderChat(); chatFetch(); }
function closeChat(){ const m=$('chatm'); if(m&&m.classList.contains('dock')) return; if(m) m.hidden=true; CH.open=false; const mm=$('chat-menu'); if(mm) mm.hidden=true; }
{ const b=$('chatbtn'); if(b) b.addEventListener('click',openChat);
