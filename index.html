  // 창이 열려 있으면 6초, 닫혀 있으면 60초마다 새 글 확인 (화면이 꺼져 있으면 쉼)
  // 넓은 화면(PC)에서는 채팅창을 오른쪽에 항상 붙여 둠 (20초마다 새 글 확인)
  const wide=matchMedia('(min-width: 980px)');
  const dock=()=>{ if(!m) return; const on=wide.matches&&RK.on; m.classList.toggle('dock',on); document.documentElement.classList.toggle('chatdock',on);
    if(on){ m.hidden=false; CH.open=true; CH.rendered=0; renderChat(); if(RK.on&&!rkNick()) setTimeout(()=>{ if(!rkNick()) showNick(); },700); } else if(!m.hidden){ m.hidden=true; CH.open=false; }
    if(typeof resize==='function') setTimeout(resize,50); };
  if(wide.addEventListener) wide.addEventListener('change',dock); dock();
  if(RK.on){ setTimeout(chatFetch,4000); setInterval(()=>{ if(document.hidden) return; const docked=m&&m.classList.contains('dock'); const gap=docked?20000:CH.open?6000:60000; if(Date.now()-(CH.lastPoll||0)>=gap-100){ CH.lastPoll=Date.now(); chatFetch(); } },5000); } }

// ===== 11e-cloud.js =====
// ---------- 클라우드 저장 (Firestore saves/{복구코드}) ----------
// 복구 코드(16자, 비밀번호 역할)를 아는 사람만 읽고 쓸 수 있음. 서버 규칙: 목록 조회 금지 → 코드를 모르면 찾을 수 없음.
// 자동 저장: 2분마다 + 화면을 벗어날 때(최소 30초 간격). 다른 기기에서 코드를 넣으면 그 기록과 랭킹 이름·순위를 그대로 이어받음.
const CL={at:0, ok:0, err:'', busy:false};
const CODE_A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 글자(0,O,1,I) 제외
function clCode(){ const s=rkLoad(); if(!s.cloud){ let c=''; for(let i=0;i<16;i++) c+=CODE_A[Math.floor(Math.random()*CODE_A.length)]; s.cloud=c; rkSave(); } return s.cloud; }
const clFmt=c=>c.replace(/(.{4})(?=.)/g,'$1-');
const clNorm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function clUpload(force){
  if(!RK.on||CL.busy) return; if(!force&&Date.now()-CL.at<30000) return;
  CL.busy=true; CL.at=Date.now();
  try{ save(); const a=await rkAuth(), s=rkLoad();
    const data=JSON.stringify({save:localStorage.getItem('chunha-gongseong'),nick:s.nick||'',refresh:s.refresh||'',uid:s.uid||'',blocked:s.blocked||[]});
    // 기록 + 서버 시각(updated)을 한 번에 기록
    await rkJson(`${FS()}:commit`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.idToken},body:JSON.stringify({writes:[{update:{name:docPath('saves',clCode()),fields:{data:{stringValue:data},best:{integerValue:String(Math.max(S.best||1,S.stage))},v:{integerValue:'1'}}},updateTransforms:[{fieldPath:'updated',setToServerValue:'REQUEST_TIME'}]}]})});
    CL.ok=Date.now(); CL.err=''; }
  catch(e){ CL.err='클라우드 저장 실패: '+e.message; }
  CL.busy=false; if(typeof renderCloud==='function') renderCloud();
}
// 다른 기기에서 저장한 기록 불러오기 → 이 기기 기록을 덮어쓰고 다시 시작
async function clLoad(code){
  code=clNorm(code); if(code.length!==16){ toast('복구 코드 16자리를 정확히 넣어 주세요'); return; }
  try{ const a=await rkAuth();
    const d=await rkJson(`${FS()}/saves/${code}`,{headers:{Authorization:'Bearer '+a.idToken}});
    const j=JSON.parse(fv(d.fields.data)); const sv=JSON.parse(j.save);
    if(!confirmLoad(sv,code,j)) return;
  }catch(e){ toast(/NOT_FOUND|404/.test(e.message)?'그 코드로 저장된 기록이 없습니다':'불러오기 실패: '+e.message); }
}
let clPending=null;
function confirmLoad(sv,code,j){
  clPending={sv,code,j}; const m=$('cl-confirm'); if(!m) return false;
  m.querySelector('p').innerHTML=`불러올 기록: <b>제${sv.stage||1}전</b> (최고 제${sv.best||1}전) · 명성 누적 ${fmt((sv.fame&&sv.fame.total)||0)}${j.nick?` · 닉네임 「${j.nick}」`:''}<br><span style="color:var(--cinnabar)">지금 이 기기의 기록(제${S.stage}전)은 지워집니다.</span>`;
  m.hidden=false; return true;
}
function applyLoad(){
  const p=clPending; if(!p) return; const s=rkLoad();
  try{ localStorage.setItem('chunha-gongseong',p.j.save); }catch(e){ toast('저장 공간 오류'); return; }
  s.cloud=p.code; if(p.j.nick) s.nick=p.j.nick; if(p.j.refresh){ s.refresh=p.j.refresh; s.uid=p.j.uid; s.idToken=''; s.exp=0; } if(p.j.blocked) s.blocked=p.j.blocked; rkSave();
  window.__noSaveOnUnload=1; location.reload();
}
// 회군 탭의 클라우드 저장 영역
let cloudBox=null;
function cloudSection(list){ const bx=document.createElement('details'); bx.className='help cloud'; list.appendChild(bx); cloudBox=bx; renderCloud(); }
function renderCloud(){
  const bx=cloudBox; if(!bx||!bx.isConnected) return; const open=bx.open;
  if(!RK.on){ bx.innerHTML='<summary>클라우드 저장</summary><p class="rk-note">서버가 연결되지 않아 사용할 수 없습니다.</p>'; return; }
  const t=CL.ok?new Date(CL.ok):null;
  bx.innerHTML=`<summary>클라우드 저장 ${t?`<span class="rk-note">· ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 저장됨</span>`:''}</summary>
    <p class="rk-note">진행 기록이 2분마다 자동으로 서버에 저장됩니다. 폰을 바꾸거나 앱을 지웠을 때 <b>복구 코드</b>를 넣으면 그대로 이어서 할 수 있습니다. 코드는 비밀번호처럼 남에게 알려 주지 마세요.</p>
    <div class="cl-code"><span>내 복구 코드</span><b id="cl-code">${clFmt(clCode())}</b><button class="buy" id="cl-copy">복사</button></div>
    ${CL.err?`<p class="rk-note rk-err">${CL.err}</p>`:''}
    <button class="buy" id="cl-now">지금 저장</button>
    <div class="cl-load"><input id="cl-in" maxlength="19" placeholder="다른 기기의 복구 코드 (XXXX-XXXX-XXXX-XXXX)"><button class="buy" id="cl-get">불러오기</button></div>`;
  bx.open=open;
  bx.querySelector('#cl-copy').addEventListener('click',()=>{ const c=clFmt(clCode()); try{ navigator.clipboard.writeText(c).then(()=>toast('복구 코드를 복사했습니다. 안전한 곳에 적어 두세요'),()=>toast('복구 코드: '+c)); }catch(e){ toast('복구 코드: '+c); } });
  bx.querySelector('#cl-now').addEventListener('click',()=>{ sfx('ui'); clUpload(true).then(()=>{ if(!CL.err) toast('클라우드에 저장했습니다'); }); });
  const ip=bx.querySelector('#cl-in'); ip.addEventListener('keydown',e=>e.stopPropagation());
  bx.querySelector('#cl-get').addEventListener('click',()=>{ sfx('ui'); clLoad(ip.value); });
}
{ const m=$('cl-confirm'); if(m){ m.querySelector('[data-a="ok"]').addEventListener('click',applyLoad); m.querySelector('[data-a="no"]').addEventListener('click',()=>{ m.hidden=true; clPending=null; }); }
  if(RK.on){ setInterval(()=>{ if(!document.hidden) clUpload(); },120000); setTimeout(()=>clUpload(true),8000);
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) clUpload(); }); } }

// ===== 12-boot.js =====
// ---------- boot ----------
let last=0, acc=0, saveT=0, lastEarned=0, draw=draw2d;
function frame(ts){
  try{ frameBody(ts); }catch(e){ console.error('frame',e); }
  requestAnimationFrame(frame);
}
function frameBody(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  // 배속: 한 화면 프레임에 게임 계산을 배속 횟수만큼 돌림 (계산 단위 0.05초는 유지 → 결과는 1배속과 동일한 규칙)
  const sp=S.speed||1; for(let i=0;i<sp;i++) step(dt); draw(dt*sp);
  acc+=dt; if(acc>0.25){ acc=0; refresh(); guideTick(); }
  saveT+=dt*(S.speed||1); if(saveT>5){ const e=Math.max(0,(S.earned||0)-(lastEarned||0)); lastEarned=S.earned||0; S.gps=(S.gps||0)*0.8+(e/saveT)*0.2; saveT=0; save(); }

}
// 미접속 보상: 마지막 저장 이후 지난 시간 × 평균 금 획득률 × 비율 (최대 시간 제한)
function grantOffline(){
  const away=S.lastT? Math.min((BAL.offline_max_hours+2*((S.fame&&S.fame.offline)||0))*3600,(Date.now()-S.lastT)/1000) : 0;
  if(away>60 && S.gps>0){ const g=S.gps*away*BAL.offline_ratio*((S.up&&S.up.offline_boost)?2:1); S.gold+=g; S.earned=(S.earned||0)+g; lastEarned=S.earned; const hh=Math.floor(away/3600), mm=Math.floor(away%3600/60); toast(`자리를 비운 ${hh?hh+'시간 ':''}${mm}분 동안 징세관이 금 ${fmt(g)} 확보`); }
  save();
}
function start(data){
  S=(data&&data.save)?migrate(data.save):load();
  lastEarned=S.earned||0;
  build(); resize(); draw=initPixi()?drawPixi:draw2d; window.__renderer=draw===drawPixi?'pixi':'2d'; renderPanel(); showPick(); renderSpeed(); renderMute();
  grantOffline();
  addEventListener('resize',resize);
  // 백그라운드 진입 시 저장, 복귀 시 자리 비운 시간만큼 보상 (안드로이드는 앱을 끄지 않고 살려두는 경우가 많음)
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else { grantOffline(); last=0; } });
  try{ window.claude?.hot?.snapshot?.(()=>({save:S})); }catch(e){}
  const go=()=>requestAnimationFrame(t=>{last=t;frame(t);});
  if(document.fonts&&document.fonts.load){ Promise.race([Promise.all([document.fonts.load('12px "Song Myung"'),document.fonts.load('12px "Gowun Dodum"')]),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(go); } else go();
}
// 시험 도구용 내부 상태 조회 (?debug 주소에서만)
if(/[?&]debug\b/.test(location.search)) { window.__dbg=()=>({units,grid,cells,N,O,CS,S,minions,troops}); window.__wp=weaponCanvas; window.__stageName=stageName; window.__px=()=>PX; window.__dbgAct={setSiege:v=>{siegeT=v;}, kill:c=>kill(c,1), state:()=>({clearing,failing,remaining})}; }
const h=window.claude?.hot;
h?.ready ? h.ready(start) : start(h?.data ?? {});

})();
